name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE=""
          if [ -n "$KEYSTORE_BASE64" ]; then
            KEYSTORE_FILE=$(mktemp --suffix=.jks)
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            export KEYSTORE_PATH="$KEYSTORE_FILE"
          fi
          
          ./gradlew assembleRelease --no-daemon

          if [ -n "$KEYSTORE_FILE" ] && [ -f "$KEYSTORE_FILE" ]; then
            rm -f "$KEYSTORE_FILE"
          fi

      - name: Prepare APK artifact
        run: |
          TAG_NAME="${{ github.ref_name }}"
          mkdir -p release-artifacts
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Erro: APK de release não encontrado."
            exit 1
          fi
          echo "APK encontrado em: $APK_PATH"
          cp "$APK_PATH" "release-artifacts/BurpeeLog-${TAG_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/BurpeeLog-${{ github.ref_name }}.apk
          generate_release_notes: true
